spring.application.name=bakery-shop

spring.datasource.url=jdbc:postgresql://localhost:5432/bakery_shop
spring.datasource.username=postgres
spring.datasource.password=change-me
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.security.user.name=admin
spring.security.user.password=change-me

# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

app.rate-limit.auth.login-ip-max-requests=${AUTH_RATE_LIMIT_LOGIN_IP_MAX_REQUESTS:5}
app.rate-limit.auth.login-ip-window=${AUTH_RATE_LIMIT_LOGIN_IP_WINDOW:1m}
app.rate-limit.auth.login-identifier-max-requests=${AUTH_RATE_LIMIT_LOGIN_IDENTIFIER_MAX_REQUESTS:5}
app.rate-limit.auth.login-identifier-window=${AUTH_RATE_LIMIT_LOGIN_IDENTIFIER_WINDOW:1m}
app.rate-limit.auth.register-ip-max-requests=${AUTH_RATE_LIMIT_REGISTER_IP_MAX_REQUESTS:3}
app.rate-limit.auth.register-ip-window=${AUTH_RATE_LIMIT_REGISTER_IP_WINDOW:10m}
